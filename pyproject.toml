[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-cursor-studio"
version = "0.1.0"
description = "离线 Windows 鼠标指针主题编辑器"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PySide6-Essentials==6.8.3", "Pillow>=11,<13", "defusedxml>=0.7,<1"]

[project.scripts]
cursor-studio = "cursor_studio.app:main"

[tool.setuptools.packages.find]
where = ["editor/src"]

[tool.pytest.ini_options]
pythonpath = ["editor/src"]
testpaths = ["editor/tests"]
